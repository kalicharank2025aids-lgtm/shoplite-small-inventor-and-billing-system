spring.datasource.url=${SHOPLITE_DB_URL:jdbc:mysql://localhost:3306/shoplite?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${SHOPLITE_DB_USERNAME:root}
spring.datasource.password=${SHOPLITE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false