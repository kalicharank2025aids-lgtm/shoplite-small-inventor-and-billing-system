server.port=8080


# ---- Default: H2 file database (no install needed, data survives restarts) ----
spring.datasource.url=jdbc:h2:file:./data/shoplite;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- To use MySQL instead: comment the H2 lines above, uncomment these ----
# spring.datasource.url=jdbc:mysql://localhost:3306/shoplite?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=YOUR_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
